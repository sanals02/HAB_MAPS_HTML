<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>خريطة حفر الباطن - النمط العادي</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
 
  <!-- Leaflet -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      font-family: "TheSansArabic", sans-serif;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    .leaflet-popup-content {
      text-align: center;
      direction: rtl;
      font-size: 14px;
    }
</style>
</head>
 
<body>
<div id="map"></div>
 
 <script>
    const map = L.map("map", {
      center: [28.4322, 45.9708],
      zoom: 13,
    });

    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
      attribution: "© Esri"
    }).addTo(map);

    // Function to get icon URL based on value
    function getColorIcon(value) {
      let color = "green"; // Default
      const val = parseFloat(value);

      if (val < 50) color = "red";
      else if (val < 75) color = "orange";
      else if (val < 90) color = "yellow";
      else color = "green";

      // Using Google Charts dynamic icons for colors
      return L.icon({
        iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${color}.png`,
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
      });
    }

    let markers = [];

    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== "habData") return;

      markers.forEach((m) => map.removeLayer(m));
      markers = [];

      const regionData = event.data.data || [];

      regionData.forEach((r) => {
        // Use the 'access' or 'satisfaction' value to determine color
        const markerIcon = getColorIcon(r.value); 

        const marker = L.marker([r.lat, r.long], { icon: markerIcon })
          .addTo(map)
          .bindPopup(`<b>${decodeURIComponent(r.name)}</b><br>Value: ${r.value}`)
          .on("click", () => {
            window.parent.postMessage({
                type: "mapClick",
                region: r.name,
            }, "*");
          });

        markers.push(marker);
      });

      if (regionData.length > 1) {
        const bounds = L.latLngBounds(regionData.map((r) => [r.lat, r.long]));
        map.fitBounds(bounds, { padding: [40, 40] });
      }
    });
</script>
</body>
</html>
