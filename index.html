<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>خريطة حفر الباطن - النمط العادي</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
 
  <!-- Leaflet -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      font-family: "TheSansArabic", sans-serif;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    .leaflet-popup-content {
      text-align: center;
      direction: rtl;
      font-size: 14px;
    }
</style>
</head>
 
<body>
<div id="map"></div>
 
  <script>
    // === Initialize map centered on Hafar Al-Batin ===
    const map = L.map("map", {
      center: [28.4322, 45.9708],
      zoom: 13,
      minZoom: 10,
      maxZoom: 22,
      zoomControl: true,
    });

    // === ESRI World Street Map ===
    const esriStreet = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 19,
        attribution: "© Esri"
      }
    ).addTo(map);

    // === Define Custom Icons ===
    // Replace 'icon-url.png' with the actual link to your marker image
    const customIcon = L.icon({
        iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png', // Replace with your image URL
        iconSize: [35, 35], // Size of the icon
        iconAnchor: [17, 35], // Point of the icon which will correspond to marker's location
        popupAnchor: [0, -35] // Point from which the popup should open relative to the iconAnchor
    });

    const selectedIcon = L.icon({
        iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png', // You can use a different color image for selection
        iconSize: [45, 45], 
        iconAnchor: [22, 45],
        popupAnchor: [0, -45]
    });

    let markers = [];
    let selectedMarker = null;

    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== "habData") return;

      // Remove old markers
      markers.forEach((m) => map.removeLayer(m));
      markers = [];

      const regionData = event.data.data || [];
      
      if (!regionData.length) return;

      // Add new markers using L.marker instead of L.circleMarker
      regionData.forEach((r) => {
        const marker = L.marker([r.lat, r.long], {
          icon: customIcon
        })
          .addTo(map)
          .bindPopup(`<b>${decodeURIComponent(r.name)}</b>`)
          .on("click", () => {
            // Reset previous marker icon
            if (selectedMarker) {
              selectedMarker.setIcon(customIcon);
            }

            // Highlight current marker by changing icon or size
            marker.setIcon(selectedIcon);
            selectedMarker = marker;

            window.parent.postMessage({
                type: "mapClick",
                region: r.name,
            }, "*");
          });

        markers.push(marker);
      });

      if (regionData.length > 1) {
        const bounds = L.latLngBounds(regionData.map((r) => [r.lat, r.long]));
        map.fitBounds(bounds, { padding: [40, 40] });
      }
    });
</script>
</body>
</html>
